name: Обновление данных и публикация сайта

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # каждый день в 09:00 UTC, после игрового дня НБА
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Выгрузка данных из ESPN
        if: github.event_name != 'push'
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python scripts/fetch_data.py

      - name: Коммит данных, если они изменились
        if: github.event_name != 'push'
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Данные не изменились, коммит не нужен."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Обновление данных лиги"
            git push
          fi

      - name: Сборка сайта
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
